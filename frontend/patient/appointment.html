<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Appointment Details</title>
<link rel="stylesheet" href="../css/style.css" />
</head>
<body>
<header class="topbar">
  <h1><span style="display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;background:var(--teal);color:#fff;border-radius:7px;font-family:'Source Serif 4',serif;font-size:14px;font-weight:600;">C</span> Clinic Portal <span class="badge">Patient</span></h1>
  <div class="nav-links">
    <a href="dashboard.html">My appointments</a>
    <a href="#" onclick="logout()">Log out</a>
  </div>
</header>
<main>
  <div id="content"><p class="muted">Loading…</p></div>
</main>
<script src="../js/config.js"></script>
<script src="../js/api.js"></script>
<script>
  Auth.requireRole('patient');
  const id = new URLSearchParams(window.location.search).get('id');

  async function load() {
    const el = document.getElementById('content');
    try {
      const a = await api(`/appointments/${id}`);
      let html = `
        <div class="card">
          <h2>Appointment <span class="pill ${a.status}">${a.status}</span></h2>
          <p>${fmtDateTime(a.slot_start)}</p>
        </div>`;

      if (a.symptomForm) {
        const s = a.symptomForm.llm_summary || {};
        html += `
        <div class="card">
          <h2>Your symptom report</h2>
          <p>${a.symptomForm.raw_symptoms}</p>
          ${s.urgency ? `<p>AI triage urgency: <span class="pill urgency-${s.urgency.toLowerCase()}">${s.urgency}</span></p>` : ''}
        </div>`;
      }

      if (a.visitNotes) {
        const s = a.visitNotes.llm_patient_summary || {};
        html += `
        <div class="card">
          <h2>Visit summary</h2>
          <p>${s.summary || ''}</p>
          ${s.medication_schedule ? `<p><strong>Medication schedule:</strong> ${s.medication_schedule}</p>` : ''}
          ${s.follow_up_steps ? `<p><strong>Follow-up:</strong> ${s.follow_up_steps}</p>` : ''}
        </div>`;
      } else if (a.status === 'confirmed') {
        html += `<div class="card"><p class="muted">Your visit summary will appear here after your appointment.</p></div>`;
      }

      el.innerHTML = html;
    } catch (err) {
      el.innerHTML = `<p class="error">${err.message}</p>`;
    }
  }
  load();
</script>
</body>
</html>
